name: CI

# Pushing a `v*` tag builds every document and attaches its PDF, plus a
# latexdiff changes PDF against the previous `v*` tag, to a GitHub Release of
# that name: `git tag v0.3-draft && git push origin v0.3-draft`.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Pull requests that change a document's .tex sources also get a changes PDF
# (latexdiff against the target branch) as the `changes-pdf` artifact, linked
# from a comment on the pull request.

# Read-only by default. Pull requests run repository code (uv sync, make), so
# only `release` and `changes-comment`, which check nothing out, may write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (lint, tests, generated files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - name: Generated files are current
        run: make check-generated

      # `--check` only inspects committed SVG exports; it does not need the
      # draw.io desktop CLI, which cannot run headless here.
      - name: draw.io exports are normalized
        run: make check-figures

      # The check that justifies committing figures and tables at all: rebuild
      # them from the committed cache and require the result back byte for
      # byte, on a different machine than the one that made them. No W&B
      # secret is involved — that is the point of committing the CSVs.
      #
      # If this fails, a figure depends on something that is not in the
      # repository (a system font, a timestamp, an unsorted dict) and the
      # committed PDF is not reproducible.
      - name: Figures and tables are reproducible
        run: |
          make plots
          make tables
          git diff --exit-code -- docs/ figures/generated/

  paper:
    name: paper (compile + submission bundle)
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    outputs:
      changes-docs: ${{ steps.changes.outputs.docs }}
      changes-failed: ${{ steps.changes.outputs.failed }}
      changes-url: ${{ steps.changes-upload.outputs.artifact-url }}
    steps:
      # Without git in the container, checkout falls back to a tarball with no
      # history, and the changes PDF below needs the previous tag's sources.
      - run: command -v git || { apt-get update && apt-get install -y --no-install-recommends git; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all history and tags, for `make diff`

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # Runs in a clean container, so no global ~/.latexmkrc can leak into the
      # build — which is exactly why this is checked here as well as locally.
      - name: Generated files are current
        run: make check-generated

      - name: Compile every document
        run: make papers

      - name: Submission bundle builds
        run: make arxiv

      # Pull requests: a latexdiff changes PDF for every document whose .tex
      # sources the PR touches, against the target branch: deletions struck
      # through in red, additions underlined in blue. HEAD is the PR merged into
      # its target, so this shows exactly what merging would change.
      # A failed diff warns instead of failing the check: latexdiff chokes on
      # some markup that compiles fine, and that must not block a merge.
      - name: Changes PDF against the target branch
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          BASE="origin/$BASE_REF"
          mkdir -p changes
          docs=""
          failed=""
          for main in docs/*/main.tex; do
            doc=$(basename "$(dirname "$main")")
            # `*` in a git pathspec crosses directories: tables/*.tex count too.
            if [ -z "$(git diff --name-only "$BASE" HEAD -- "docs/$doc/*.tex")" ]; then
              continue
            fi
            if ! git cat-file -e "$BASE:docs/$doc/main.tex" 2>/dev/null; then
              echo "::notice::$doc does not exist on $BASE_REF, no changes PDF"
              continue
            fi
            if make diff PAPER="$doc" OLD="$BASE"; then
              cp "build/$doc-diff/main.pdf" "changes/$doc-changes-vs-$BASE_REF.pdf"
              docs="$docs $doc"
            else
              echo "::warning::latexdiff failed for $doc, see the log of this step"
              failed="$failed $doc"
            fi
          done
          echo "docs=$(echo $docs)" >> "$GITHUB_OUTPUT"
          echo "failed=$(echo $failed)" >> "$GITHUB_OUTPUT"
          [ -n "$docs$failed" ] || echo "no .tex changes under docs/, no changes PDF"

      - uses: actions/upload-artifact@v4
        id: changes-upload
        if: steps.changes.outputs.docs != ''
        with:
          name: changes-pdf
          path: changes/*.pdf
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: papers
          path: docs/*/build/main.pdf
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: submission-bundles
          path: build/*-arxiv.zip
          if-no-files-found: ignore

      # Every document's main.pdf is renamed to <document>-<tag>.pdf so the
      # release assets are distinguishable once downloaded.
      - name: Collect PDFs for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          mkdir -p release
          for pdf in docs/*/build/main.pdf; do
            doc=$(basename "$(dirname "$(dirname "$pdf")")")
            cp "$pdf" "release/$doc-$GITHUB_REF_NAME.pdf"
          done

      # latexdiff against the previous `v*` tag: deletions struck through in
      # red, additions underlined in blue. Required for every document that
      # existed at that tag: a failed diff fails the release. Without a baseline
      # there is nothing to compare, so the plain PDF alone ships: the first
      # release (tag an older commit, e.g. v0.0, to give it one) and a document
      # added since the previous tag.
      - name: Changes PDF since the previous release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null) \
            || { echo "::notice::no previous v* tag, releasing without changes PDFs"; exit 0; }
          for main in docs/*/main.tex; do
            doc=$(basename "$(dirname "$main")")
            git cat-file -e "$PREV:docs/$doc/main.tex" 2>/dev/null \
              || { echo "::notice::$doc is new since $PREV, releasing it without a changes PDF"; continue; }
            make diff PAPER="$doc" OLD="$PREV"
            cp "build/$doc-diff/main.pdf" "release/$doc-$GITHUB_REF_NAME-changes-since-$PREV.pdf"
          done

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-pdfs
          path: release/*.pdf
          if-no-files-found: error

  # The only job with write access: it publishes the PDFs `paper` built and
  # never checks out or runs repository code.
  release:
    name: release (attach PDFs to the GitHub Release)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: paper
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-pdfs
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.pdf
          fail_on_unmatched_files: true

  # Links the changes PDF from a comment on the pull request, updated in place
  # on every push. Like `release`, it checks nothing out and runs no repository
  # code. On a pull request from a fork the token cannot write, so the comment is
  # skipped there and the PDF stays under the run's artifacts.
  changes-comment:
    name: changes (link the changes PDF on the PR)
    if: >-
      github.event_name == 'pull_request' &&
      (needs.paper.outputs.changes-docs != '' || needs.paper.outputs.changes-failed != '')
    needs: paper
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        continue-on-error: true
        env:
          DOCS: ${{ needs.paper.outputs.changes-docs }}
          FAILED: ${{ needs.paper.outputs.changes-failed }}
          URL: ${{ needs.paper.outputs.changes-url }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- latexdiff-changes-pdf -->';
            const { DOCS, FAILED, URL, BASE_REF, HEAD_SHA } = process.env;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = [marker, `### Changes PDF against \`${BASE_REF}\``, ''];
            if (DOCS) {
              lines.push(`**[Download the changes PDF](${URL})** (zip) for ${DOCS.split(' ').map(d => `\`${d}\``).join(', ')}: deletions in red, additions in blue.`);
            }
            if (FAILED) {
              lines.push(`latexdiff failed for ${FAILED.split(' ').map(d => `\`${d}\``).join(', ')}, see the [run log](${run}).`);
            }
            lines.push('', `<sub>Built from ${HEAD_SHA.slice(0, 7)} merged into \`${BASE_REF}\`, [workflow run](${run}). Updated on every push.</sub>`);
            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  templates:
    name: templates (every template compiles the same prose)
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # A template that stops compiling is invisible until someone switches to
      # it months later, mid-deadline. Compile the first document under every
      # template on every push, and require the prose to come through untouched.
      - name: All templates build
        # Plain POSIX sh: the texlive image has no bash, so GitHub falls back to
        # `sh -e {0}` and brace expansion is not available here.
        run: |
          set -eu
          PAPER=$(basename "$(dirname "$(ls docs/*/main.tex | head -1)")")
          BEFORE=$(sha256sum \
            "docs/$PAPER/metadata.tex" "docs/$PAPER/abstract.tex" \
            "docs/$PAPER/text.tex" "docs/$PAPER/acronyms.tex")
          for t in $(ls -d tools/templates/*/ | xargs -n1 basename | grep -v '^_'); do
            echo "::group::$t"
            make set-template PAPER="$PAPER" TEMPLATE="$t" FORCE=1
            rm -rf "docs/$PAPER/build"
            make paper PAPER="$PAPER"
            test -f "docs/$PAPER/build/main.pdf" || { echo "no PDF for $t"; exit 1; }
            echo "::endgroup::"
          done
          echo "$BEFORE" | sha256sum --check --status \
            || { echo "a template switch modified the prose files"; exit 1; }
