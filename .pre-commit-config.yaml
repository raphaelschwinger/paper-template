# Install once with:  uv run pre-commit install
#
# Deliberately short. The expensive checks (tests, LaTeX) run in CI; a
# pre-commit hook that takes 30 seconds gets bypassed with --no-verify, which is
# worse than not having it.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(bib|drawio|svg|csv)$'
      - id: end-of-file-fixer
        exclude: '\.(drawio|svg|pdf|png)$'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # The W&B cache belongs in git; a raw history dump does not. This is the
        # backstop for "aggregate before you commit".
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: [--ignore-words-list=nd,te,ot,fo]
        exclude: '\.(bib|lock|drawio|svg|csv)$'

  - repo: local
    hooks:
      # The generated-file contract, enforced at the point where it breaks.
      - id: check-generated
        name: generated files are current (bib copies, figures, tables, W&B lock)
        entry: uv run python tools/check_generated.py
        language: system
        pass_filenames: false
        files: '^(references\.bib|paper\.yml|figures/|tables/|docs/|tools/templates/|data/)'
