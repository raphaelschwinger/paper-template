[project]
name = "paper"
version = "0.1.0"
description = "A paper repository: LaTeX documents, figures and tables built from Weights & Biases runs."
requires-python = ">=3.12"

# Deliberately light. This repository compiles a paper; it does not train
# anything. No torch, no CUDA index, no workspace — so it can be checked out as
# a submodule of any code repository without entangling the two lockfiles.
dependencies = [
    "wandb>=0.18",              # tools/fetch.py
    "pandas>=2.2",              # the CSV cache and every figure/table script
    "matplotlib>=3.9",          # paperkit.plotting
    "pyyaml>=6.0",              # wandb.yml, template.yml, .template-upstream.yml
    "bibtexparser>=1.4,<2.0",   # tools/bib_absorb.py
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pre-commit>=4.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 99
target-version = "py312"
# Ruff formats fenced Python in Markdown, which is wrong for documentation:
# it collapses illustrative stubs (`def draw(...): ...`) onto one line and
# fights the prose around them. The docs are read, not executed.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # typer/click idioms rely on calls in defaults
]

[tool.ruff.lint.isort]
known-first-party = ["paperkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperkit"]
